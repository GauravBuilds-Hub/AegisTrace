title: Registry Run Key Modification
id: AT-PERSIST-001
status: experimental
description: AegisTrace academic detection specification for Registry Run Key Modification.
author: AegisTrace Project
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    CommandLine|contains|all: ['reg add', 'currentversion']
    CommandLine|contains: ['\\run', '\\runonce', '\\startup']
  condition: selection
level: high
tags:
  - attack.t1060
