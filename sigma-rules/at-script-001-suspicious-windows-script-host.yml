title: Suspicious Windows Script Host
id: AT-SCRIPT-001
status: experimental
description: AegisTrace academic detection specification for Suspicious Windows Script Host.
author: AegisTrace Project
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image|endswith: ['\\wscript.exe', '\\cscript.exe']
    CommandLine|contains: ['http://', 'https://', 'javascript', 'vbscript', '.vbs', '.js']
  condition: selection
level: medium
tags:
  - attack.t1059.005
