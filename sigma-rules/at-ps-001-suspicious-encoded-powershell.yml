title: Suspicious Encoded PowerShell
id: AT-PS-001
status: experimental
description: AegisTrace academic detection specification for Suspicious Encoded PowerShell.
author: AegisTrace Project
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image|contains: powershell
    CommandLine|contains: ['-enc', '-encodedcommand', 'frombase64string']
  condition: selection
level: high
tags:
  - attack.t1059.001
