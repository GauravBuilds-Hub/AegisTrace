title: Suspicious Rundll32 Execution
id: AT-LOL-002
status: experimental
description: AegisTrace academic detection specification for Suspicious Rundll32 Execution.
author: AegisTrace Project
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image|endswith: '\\rundll32.exe'
    CommandLine|contains: ['javascript:', 'url.dll', 'http://', 'https://']
  condition: selection
level: high
tags:
  - attack.t1218.011
