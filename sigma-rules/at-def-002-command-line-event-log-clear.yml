title: Command-line Event Log Clear
id: AT-DEF-002
status: experimental
description: AegisTrace academic detection specification for Command-line Event Log Clear.
author: AegisTrace Project
logsource:
  product: windows
  service: process_creation
detection:
  selection:
    Image|endswith: '\\wevtutil.exe'
    CommandLine|contains: [' cl ', 'clear-log']
  condition: selection
level: high
tags:
  - attack.t1070.001
